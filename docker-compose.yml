services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recicla
      POSTGRES_USER: recicla
      POSTGRES_PASSWORD: recicla
    volumes:
      - recicla_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recicla -d recicla"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://recicla:recicla@db:5432/recicla
      SECRET_KEY: demo-secret-change-in-production-7f4b1a9d
      QR_SECRET_KEY: demo-qr-secret-change-in-production-3c8e52f1
      CORS_ORIGINS: "http://localhost:${RECICLA_FRONTEND_PORT:-3210}"
    ports:
      - "${RECICLA_BACKEND_PORT:-8210}:8100"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "/api/v1"
    ports:
      - "${RECICLA_FRONTEND_PORT:-3210}:3100"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  recicla_postgres_data:
